name: Hide badges on my channel
description: Opt your channel out of Badges+ badges, or opt back in
title: "Hide badges: "
labels: ["hide-request"]
body:
  - type: markdown
    attributes:
      value: |
        1. Add `[badgesplus:hide]` to your YouTube channel description.
        2. Fill in this form. A bot checks your channel page and updates the list automatically.

        To undo it later, remove the tag from your description and submit this form again with "Show badges again".
  - type: input
    id: handle
    attributes:
      label: Channel handle
      placeholder: "@yourhandle"
    validations:
      required: true
  - type: dropdown
    id: request
    attributes:
      label: Request
      options:
        - Hide badges
        - Show badges again
    validations:
      required: true
