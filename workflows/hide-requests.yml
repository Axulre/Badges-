name: Process hide requests

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: hide-requests

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'hide-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const branch = context.payload.repository.default_branch;
            const lines = (issue.body || '').split(/\r?\n/);

            const field = name => {
              const i = lines.findIndex(l => l.trim() === '### ' + name);
              if (i < 0) return '';
              for (let j = i + 1; j < lines.length; j++) {
                const line = lines[j].trim();
                if (line.startsWith('###')) return '';
                if (line) return line;
              }
              return '';
            };

            const reply = async (text, close) => {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: text });
              if (close) {
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
              }
            };

            const handle = field('Channel handle').toLowerCase();
            const wantsHide = field('Request') === 'Hide badges';

            if (!/^@[a-z0-9._-]{3,30}$/.test(handle)) {
              await reply('That does not look like a channel handle. Edit the issue and enter it like `@yourhandle`.', false);
              return;
            }

            const res = await fetch('https://www.youtube.com/' + handle, {
              headers: {
                'accept-language': 'en-US,en;q=0.9',
                'cookie': 'SOCS=CAI; CONSENT=YES+1',
                'user-agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
              }
            });

            if (!res.ok) {
              await reply('Could not load that channel page (HTTP ' + res.status + '). Check the handle, or wait for a maintainer to review this manually.', false);
              return;
            }

            const html = await res.text();
            const start = html.indexOf('"channelMetadataRenderer"');
            if (start < 0) {
              await reply('Could not read that channel page from GitHub. A maintainer will review this manually.', false);
              return;
            }

            const hasTag = /badgesplus:hide/i.test(html.slice(start, start + 8000));

            if (wantsHide && !hasTag) {
              await reply('I could not find `[badgesplus:hide]` in the description of ' + handle + '. Add it, then edit this issue (any small change) and I will check again. It can take a few minutes for YouTube to show the new description.', false);
              return;
            }

            if (!wantsHide && hasTag) {
              await reply('The description of ' + handle + ' still contains `[badgesplus:hide]`. Remove it, then edit this issue and I will check again.', false);
              return;
            }

            for (let attempt = 0; attempt < 3; attempt++) {
              const file = await github.rest.repos.getContent({ ...context.repo, path: 'badges.json', ref: branch });
              const data = JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8'));
              const hidden = Array.isArray(data.hidden) ? data.hidden.map(s => String(s).toLowerCase()) : [];
              const present = hidden.includes(handle);

              if (wantsHide === present) {
                await reply(wantsHide ? handle + ' is already on the hidden list.' : handle + ' is not on the hidden list.', true);
                return;
              }

              data.hidden = wantsHide ? hidden.concat(handle) : hidden.filter(h => h !== handle);

              try {
                await github.rest.repos.createOrUpdateFileContents({
                  ...context.repo,
                  path: 'badges.json',
                  branch,
                  sha: file.data.sha,
                  message: (wantsHide ? 'Hide badges for ' : 'Show badges again for ') + handle,
                  content: Buffer.from(JSON.stringify(data, null, 2) + '\n').toString('base64')
                });
              } catch (err) {
                if (attempt === 2) throw err;
                continue;
              }

              await reply(wantsHide
                ? 'Done. Badges are now hidden on ' + handle + ' for everyone. It can take up to 6 hours to reach all users.'
                : 'Done. ' + handle + ' has been removed from the hidden list. It can take up to 6 hours to reach all users.', true);
              return;
            }
